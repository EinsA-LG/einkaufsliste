name: Supabase wach halten

# Supabase pausiert kostenlose Projekte nach ca. 1 Woche ohne Nutzung.
# Diese Aufgabe fragt die Einkaufsliste alle 3 Tage kurz ab (nur lesend),
# damit die Datenbank aktiv bleibt.

on:
  schedule:
    - cron: "17 6 */3 * *"   # alle 3 Tage um 06:17 UTC
  workflow_dispatch:          # kann auch per Hand gestartet werden

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Einkaufsliste kurz abfragen
        env:
          SUPABASE_KEY: sb_publishable_jNDfzzRDx6rWqW2CoM6wHQ_6j9x_v-4
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://ulhanrkmsepzyvcvdcno.supabase.co/rest/v1/items?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Antwort von Supabase: $status"
          test "$status" = "200"

      - name: Automatische Abschaltung durch GitHub verhindern
        # GitHub schaltet zeitgesteuerte Aufgaben in oeffentlichen Repos nach
        # 60 Tagen ohne Aenderungen ab. Das erneute Aktivieren verhindert das.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable"
